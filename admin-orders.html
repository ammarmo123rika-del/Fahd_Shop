<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Orders - My Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">My<span>Store</span></a>
    <div class="header-links">
      <a class="loginLink" href="login.html">
        <span class="label">Hello, Host</span>
        <span class="value">⚙️ Host</span>
      </a>
    </div>
  </div>
</div>
<div class="nav-bar">
  <div class="nav-bar-inner">
    <a href="admin.html">📊 Dashboard</a>
    <a href="admin-orders.html" class="active">📋 Orders</a>
    <a href="admin-products.html">📦 Products</a>
    <a href="admin-customers.html">👥 Customers</a>
    <a href="chat.html">💬 Chat</a>
    <a href="index.html">🏠 Store Front</a>
  </div>
</div>
<section>
  <div style="background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);border-radius:20px;padding:40px;margin-bottom:28px;color:#fff;box-shadow:0 20px 60px rgba(15,12,41,0.4)">
    <h1 style="font-size:32px;margin-bottom:8px">📋 Manage Orders</h1>
    <p style="opacity:0.8">View and manage all customer orders.</p>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <div style="padding:20px 24px;border-bottom:1px solid #f0f0f0">
      <h2>All Orders</h2>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr><th>Order</th><th>Customer</th><th>Total</th><th>Items</th><th>Status</th></tr>
        </thead>
        <tbody id="adminOrders"></tbody>
      </table>
    </div>
  </div>
</section>
<footer>
  <p>© 2026 My Store Host Panel.</p>
</footer>
<script src="app.js"></script>
<script>
(async function(){
  var user = getCurrentUser();
  if(!user || user.role !== 'host') {
    document.querySelector('section').innerHTML = '<div class="empty"><div class="icon">🔒</div><h2>Access Denied</h2><p>Please login as host</p></div>';
    return;
  }
  var orders = await apiGet('/api/orders');
  var c = document.getElementById('adminOrders');
  if(!orders.length) {
    c.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;padding:24px">No orders yet</td></tr>';
    return;
  }
  c.innerHTML = orders.reverse().map(function(o) {
    var statusClass = o.status === 'Delivered' ? 'badge-green' : o.status === 'Shipped' ? 'badge-yellow' : 'badge-red';
    return '<tr><td>#' + o.id + '</td><td>' + (o.user || 'Guest') + '</td><td style="font-weight:700">$' + (o.total || 0).toLocaleString() + '</td><td>' + o.items.length + ' item(s)</td><td><select onchange="updateOrderStatus(' + o.id + ',this.value)" style="padding:6px 10px;border-radius:8px;border:2px solid #e8e8e8;font-size:13px;cursor:pointer"><option ' + (o.status === 'Pending' ? 'selected' : '') + '>Pending</option><option ' + (o.status === 'Shipped' ? 'selected' : '') + '>Shipped</option><option ' + (o.status === 'Delivered' ? 'selected' : '') + '>Delivered</option></select></td></tr>';
  }).join('');
})();
</script>
</body>
</html>
