<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat - Fahd Shop</title>
<link rel="stylesheet" href="style.css">
<style>
body { background: #eaeded; }
.chat-page { display: flex; height: calc(100vh - 110px); max-width: 1200px; margin: 0 auto; overflow: hidden; }
.chat-sidebar { width: 280px; background: #fff; border-right: 1px solid #d5d9d9; display: flex; flex-direction: column; flex-shrink: 0; }
.chat-sidebar-header { padding: 16px; border-bottom: 1px solid #d5d9d9; }
.chat-sidebar-header h2 { font-size: 18px; margin: 0; }
.chat-search { padding: 10px 16px; border-bottom: 1px solid #eee; }
.chat-search input { width: 100%; padding: 8px 12px; border: 1px solid #d5d9d9; border-radius: 20px; font-size: 13px; outline: none; }
.chat-search input:focus { border-color: #e77600; }
.chat-list { flex: 1; overflow-y: auto; }
.chat-user { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f5f5f5; transition: background .15s; }
.chat-user:hover, .chat-user.active { background: #f0f2f2; }
.chat-user-avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0; position: relative; }
.chat-user-avatar.online::after { content: ''; position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #10b981; border: 2px solid #fff; border-radius: 50%; }
.chat-user-info { flex: 1; min-width: 0; }
.chat-user-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-user-preview { font-size: 12px; color: #565959; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.chat-user-time { font-size: 11px; color: #999; white-space: nowrap; }
.chat-user-badge { background: #cc0c39; color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 2px 6px; min-width: 18px; text-align: center; }

.chat-main { flex: 1; display: flex; flex-direction: column; background: #f5f5f5; }
.chat-header { background: #232f3e; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
.chat-header-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; background: #37475a; }
.chat-header-info { flex: 1; }
.chat-header-name { font-weight: 700; font-size: 15px; }
.chat-header-status { font-size: 12px; color: #90cdf4; }
.chat-header-actions { display: flex; gap: 8px; }
.chat-header-actions button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 6px; border-radius: 8px; }
.chat-header-actions button:hover { background: rgba(255,255,255,.1); }

.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d5d9d9' fill-opacity='0.15'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
.msg-bubble { max-width: 65%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; position: relative; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.msg-incoming { align-self: flex-start; background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
.msg-outgoing { align-self: flex-end; background: #0084ff; color: #fff; border-bottom-right-radius: 4px; }
.msg-time { font-size: 10px; opacity: .6; margin-top: 4px; text-align: right; }
.msg-outgoing .msg-time { text-align: right; }
.msg-incoming .msg-time { text-align: left; }
.msg-system { align-self: center; background: rgba(0,0,0,.05); color: #666; font-size: 12px; padding: 6px 14px; border-radius: 20px; max-width: 80%; text-align: center; }
.msg-date-divider { text-align: center; font-size: 11px; color: #999; padding: 8px 0; }
.typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }
.typing-indicator span { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: typingDot 1.4s infinite; }
.typing-indicator span:nth-child(2) { animation-delay: .2s; }
.typing-indicator span:nth-child(3) { animation-delay: .4s; }
@keyframes typingDot { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-6px); opacity: 1; } }

.chat-input { padding: 12px 16px; background: #fff; border-top: 1px solid #d5d9d9; display: flex; gap: 10px; align-items: flex-end; }
.chat-input textarea { flex: 1; padding: 10px 14px; border: 1px solid #d5d9d9; border-radius: 20px; font-size: 14px; font-family: inherit; resize: none; min-height: 42px; max-height: 100px; outline: none; line-height: 1.4; }
.chat-input textarea:focus { border-color: #0084ff; box-shadow: 0 0 0 2px rgba(0,132,255,.15); }
.chat-input .send-btn { width: 42px; height: 42px; border-radius: 50%; background: #0084ff; color: #fff; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s, transform .1s; }
.chat-input .send-btn:hover { background: #0073e6; }
.chat-input .send-btn:active { transform: scale(.95); }
.chat-input .attach-btn { width: 42px; height: 42px; border-radius: 50%; background: #f0f2f2; border: none; font-size: 18px; cursor: pointer; flex-shrink: 0; }
.chat-input .attach-btn:hover { background: #e2e8f0; }

.no-chat-selected { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; font-size: 16px; text-align: center; padding: 40px; }
.no-chat-selected .icon { font-size: 64px; margin-bottom: 16px; }

@media (max-width: 768px) {
  .chat-page { height: calc(100vh - 100px); }
  .chat-sidebar { width: 100%; }
  .chat-sidebar.hidden-mobile { display: none; }
  .chat-main.hidden-mobile { display: none; }
  .chat-header .back-btn { display: block; }
}
</style>
</head>
<body>
<div class="top-bar">
  <a class="logo" href="index.html">Fahd<span>Shop</span></a>
  <div class="search-bar"><input type="text" placeholder="Search Fahd Shop" id="searchInput" onkeydown="if(event.key==='Enter'){location.href='products.html?search='+this.value}"><button onclick="location.href='products.html?search='+(document.getElementById('searchInput').value||'')">🔍</button></div>
  <div class="top-links">
    <a href="admin.html" style="color:#ff9900"><b>⚙️ Admin</b></a>
    <a href="login.html"><span class="greeting">Hello, Sign in</span><br><b>Account</b></a>
    <a href="cart.html" class="cart-link"><span class="cart-icon">🛒</span><span class="cart-count" id="cartCount" style="display:none">0</span>Cart</a>
  </div>
</div>
<div class="accent-line"></div>
<div class="subnav">
  <a href="admin.html">⚙️ Dashboard</a>
  <a href="admin-products.html">📦 Products</a>
  <a href="admin-orders.html">📋 Orders</a>
  <a href="admin-customers.html">👥 Customers</a>
  <a href="chat.html" class="active">💬 Chat</a>
  <a href="add-product.html">➕ Add Product</a>
  <a href="admin-settings.html">🔧 Settings</a>
  <a href="index.html" style="color:#ff9900">🏪 View Store</a>
</div>

<div class="container" style="padding-top:12px">
  <div class="chat-page">
    <!-- Sidebar: Conversations -->
    <div class="chat-sidebar" id="chatSidebar">
      <div class="chat-sidebar-header">
        <h2>💬 Messages</h2>
      </div>
      <div class="chat-search">
        <input type="text" placeholder="Search conversations..." id="chatSearch" oninput="filterChatList()">
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <!-- Main: Chat Window -->
    <div class="chat-main" id="chatMain">
      <div class="no-chat-selected" id="noChat">
        <div>
          <div class="icon">💬</div>
          <h3 style="margin-bottom:8px;color:#333">Select a conversation</h3>
          <p>Choose a customer from the sidebar to start chatting</p>
        </div>
      </div>
      
      <div id="chatWindow" style="display:none;flex:1;display:flex;flex-direction:column">
        <div class="chat-header" id="chatHeader">
          <button class="back-btn" onclick="showSidebar()" style="display:none;background:none;border:none;color:#fff;font-size:20px;cursor:pointer">←</button>
          <div class="chat-header-avatar" id="headerAvatar">CU</div>
          <div class="chat-header-info">
            <div class="chat-header-name" id="headerName">Customer</div>
            <div class="chat-header-status" id="headerStatus">● Online</div>
          </div>
          <div class="chat-header-actions">
            <button title="Call">📞</button>
            <button title="Video">📹</button>
            <button title="More">⋯</button>
          </div>
        </div>
        
        <div class="chat-messages" id="chatMessages"></div>
        
        <div class="chat-input">
          <button class="attach-btn" title="Attach file" onclick="alert('File sharing coming soon!')">📎</button>
          <textarea id="chatInput" placeholder="Type a message..." rows="1" onkeydown="handleChatKey(event)" oninput="autoResizeInput(this)"></textarea>
          <button class="send-btn" onclick="sendChat()" title="Send">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
updateCartCount();
var currentChatUser = '';
var user = getCurrentUser();
var myEmail = user ? user.email : 'admin@fahd.shop';

// Color palette for avatars
var avatarColors = ['#232f3e','#e63946','#457b9d','#2a9d8f','#e9c46a','#f4a261','#264653','#6d597a','#b56576','#355070'];

function getAvatarColor(email) {
  var hash = 0;
  for (var i = 0; i < email.length; i++) hash = email.charCodeAt(i) + ((hash << 5) - hash);
  return avatarColors[Math.abs(hash) % avatarColors.length];
}

// Load conversations
function loadConversations() {
  fetch('/api/messages').then(function(r){return r.json()}).then(function(msgs) {
    var convMap = {};
    msgs.forEach(function(m) {
      var other = m.from === myEmail ? m.to : m.from;
      if (!other) return;
      if (!convMap[other] || new Date(m.date) > new Date(convMap[other].lastDate)) {
        convMap[other] = { email: other, lastMsg: m.text, lastDate: m.date, unread: 0, from: m.from };
      }
      if (m.to === myEmail && !m.read) convMap[other].unread++;
    });
    
    var convs = Object.values(convMap).sort(function(a,b) { return new Date(b.lastDate) - new Date(a.lastDate); });
    
    var el = document.getElementById('chatList');
    if (!convs.length) {
      el.innerHTML = '<div style="text-align:center;padding:30px;color:#999"><div style="font-size:40px;margin-bottom:8px">📭</div><p>No conversations yet</p><p style="font-size:12px">Customers will appear here when they send messages</p></div>';
      return;
    }
    
    el.innerHTML = convs.map(function(c) {
      var name = c.email.split('@')[0];
      var initials = name.slice(0,2).toUpperCase();
      var color = getAvatarColor(c.email);
      var time = formatTime(c.lastDate);
      var preview = (c.from === myEmail ? 'You: ' : '') + (c.lastMsg || '').slice(0, 40);
      var isActive = c.email === currentChatUser;
      var customerNames = JSON.parse(localStorage.getItem('fahd_customer_names') || '{}');
      var displayName = customerNames[c.email] || name;
      
      return '<div class="chat-user' + (isActive ? ' active' : '') + '" onclick="openChat(\'' + escHtml(c.email) + '\')">' +
        '<div class="chat-user-avatar online" style="background:' + color + '">' + initials + '</div>' +
        '<div class="chat-user-info">' +
          '<div class="chat-user-name">' + escHtml(displayName) + '</div>' +
          '<div class="chat-user-preview">' + escHtml(preview) + '</div>' +
        '</div>' +
        '<div style="text-align:right">' +
          '<div class="chat-user-time">' + time + '</div>' +
          (c.unread > 0 ? '<div class="chat-user-badge">' + c.unread + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }).catch(function() {
    document.getElementById('chatList').innerHTML = '<div style="text-align:center;padding:30px;color:#999">Could not load conversations</div>';
  });
}

function openChat(email) {
  currentChatUser = email;
  document.getElementById('noChat').style.display = 'none';
  var cw = document.getElementById('chatWindow');
  cw.style.display = 'flex';
  
  var name = email.split('@')[0];
  var customerNames = JSON.parse(localStorage.getItem('fahd_customer_names') || '{}');
  var displayName = customerNames[email] || name;
  var initials = displayName.slice(0,2).toUpperCase();
  var color = getAvatarColor(email);
  
  document.getElementById('headerAvatar').textContent = initials;
  document.getElementById('headerAvatar').style.background = color;
  document.getElementById('headerName').textContent = displayName;
  document.getElementById('headerStatus').textContent = '● Online';
  
  loadMessages(email);
  loadConversations(); // refresh sidebar
  
  // Mobile: hide sidebar
  if (window.innerWidth <= 768) {
    document.getElementById('chatSidebar').classList.add('hidden-mobile');
  }
  
  setTimeout(function() { document.getElementById('chatInput').focus(); }, 100);
}

function loadMessages(email) {
  fetch('/api/messages').then(function(r){return r.json()}).then(function(msgs) {
    var filtered = msgs.filter(function(m) {
      return (m.from === myEmail && m.to === email) || (m.from === email && m.to === myEmail);
    }).sort(function(a,b) { return new Date(a.date) - new Date(b.date); });
    
    var el = document.getElementById('chatMessages');
    if (!filtered.length) {
      el.innerHTML = '<div class="msg-system">Start of conversation with ' + escHtml(email) + '</div>';
      return;
    }
    
    var html = '';
    var lastDate = '';
    filtered.forEach(function(m) {
      var msgDate = new Date(m.date).toLocaleDateString();
      if (msgDate !== lastDate) {
        html += '<div class="msg-date-divider">' + msgDate + '</div>';
        lastDate = msgDate;
      }
      var isMe = m.from === myEmail;
      var time = new Date(m.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      html += '<div class="msg-bubble ' + (isMe ? 'msg-outgoing' : 'msg-incoming') + '">' +
        '<div>' + escHtml(m.text || '') + '</div>' +
        '<div class="msg-time">' + time + (isMe ? ' ✓✓' : '') + '</div>' +
      '</div>';
    });
    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
  });
}

function sendChat() {
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text || !currentChatUser) return;
  input.value = '';
  input.style.height = 'auto';
  
  fetch('/api/messages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ from: myEmail, to: currentChatUser, text: text })
  }).then(function() {
    loadMessages(currentChatUser);
    loadConversations();
  }).catch(function() { alert('Failed to send'); });
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

function autoResizeInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function showSidebar() {
  document.getElementById('chatSidebar').classList.remove('hidden-mobile');
  document.getElementById('chatMain').classList.add('hidden-mobile');
}

function filterChatList() {
  var q = document.getElementById('chatSearch').value.toLowerCase();
  document.querySelectorAll('.chat-user').forEach(function(el) {
    var name = el.querySelector('.chat-user-name').textContent.toLowerCase();
    el.style.display = name.includes(q) ? '' : 'none';
  });
}

function formatTime(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  var now = new Date();
  var diff = now - d;
  if (diff < 60000) return 'now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h';
  if (diff < 604800000) return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return d.toLocaleDateString();
}

function escHtml(s) { return String(s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// Init
loadConversations();

// Auto-refresh every 3 seconds
setInterval(function() { loadConversations(); if (currentChatUser) loadMessages(currentChatUser); }, 3000);

// Check URL params for user
var params = new URLSearchParams(location.search);
var chatUser = params.get('user');
if (chatUser) setTimeout(function() { openChat(chatUser); }, 500);

// Mobile back button
if (window.innerWidth <= 768) {
  document.querySelector('.chat-header .back-btn').style.display = 'block';
}
</script>

<div class="footer">
  <div class="footer-back" onclick="window.scrollTo(0,0)">Back to top</div>
  <div class="footer-divider"></div>
  <div class="footer-bottom"><div class="logo">Fahd<span>Shop</span></div><p>© 2026 Fahd Shop</p></div>
</div>
</body>
</html>
