<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Product - Fahd Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">Fahd<span>Shop</span></a>
    <div class="header-links">
      <a class="loginLink" href="login.html">
        <span class="label">Hello, Fahd</span>
        <span class="value">Host</span>
      </a>
    </div>
  </div>
</div>
<div class="nav-bar">
  <div class="nav-bar-inner">
    <a href="admin.html">Dashboard</a>
    <a href="add-product.html" class="active">Add Product</a>
    <a href="index.html">Store Front</a>
  </div>
</div>
<section>
  <div class="form-card" style="max-width:600px">
    <h1 style="margin-bottom:4px">Add New Product</h1>
    <p class="subtitle">Fill in the details to add a product to your store</p>
    <div id="addProductForm">
      <label for="pName">Product Name *</label>
      <input type="text" id="pName" placeholder="e.g. Apple iPhone 15 Pro Max">
      <label for="pPrice">Price *</label>
      <input type="number" id="pPrice" placeholder="999" min="0" step="0.01">
      <label for="pOldPrice">Original Price</label>
      <input type="number" id="pOldPrice" placeholder="1099" min="0" step="0.01">
      <label for="pImage">Emoji Icon</label>
      <input type="text" id="pImage" placeholder="Phone emoji" maxlength="4">
      <label for="pCategory">Category *</label>
      <select id="pCategory">
        <option value="Electronics">Electronics</option>
        <option value="Fashion">Fashion</option>
        <option value="Home">Home</option>
        <option value="Books">Books</option>
        <option value="Gaming">Gaming</option>
        <option value="Sports">Sports</option>
        <option value="Other">Other</option>
      </select>
      <label for="pStock">Stock Quantity</label>
      <input type="number" id="pStock" placeholder="50" min="0">
      <label for="pDesc">Description</label>
      <textarea id="pDesc" placeholder="Describe the product..."></textarea>
      <button class="btn-amazon" onclick="addProduct()" style="margin-top:8px">Add Product</button>
    </div>
    <div id="msg"></div>
    <hr style="margin:20px 0;border:none;border-top:1px solid #e7e7e7">
    <div style="text-align:center"><a href="admin.html">Back to Dashboard</a></div>
  </div>
</section>
<footer><p>Fahd Shop Host Panel</p></footer>
<script src="app.js"></script>
</body>
</html>
