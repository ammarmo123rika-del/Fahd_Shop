<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Product - My Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">Fahd<span>Shop</span></a>
    <div class="header-links">
      <a class="loginLink" href="login.html"><span class="label">Hello, Fahd</span><span class="value">⚙️ Host</span></a>
    </div>
  </div>
</div>
<div class="nav-bar"><div class="nav-bar-inner">
  <a href="admin.html">📊 Dashboard</a><a href="add-product.html" class="active">➕ Add Product</a><a href="index.html">🏠 Store Front</a>
</div></div>
<section>
  <div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:20px;padding:30px 40px;margin-bottom:24px;color:#fff;box-shadow:0 10px 40px rgba(102,126,234,0.3)">
    <h1 style="font-size:32px">➕ Add New Product</h1>
    <p style="opacity:0.9">Fill in the details to add a product to your store</p>
  </div>
  <div class="form-card" style="max-width:640px">
    <div id="addProductForm">
      <label for="pName">Product Name *</label>
      <input type="text" id="pName" placeholder="e.g. Apple iPhone 15 Pro Max">
      <label for="pPrice">Price *</label>
      <input type="number" id="pPrice" placeholder="999" min="0" step="0.01">
      <label for="pOldPrice">Original Price</label>
      <input type="number" id="pOldPrice" placeholder="1099" min="0" step="0.01">
      <label for="pImage">Emoji Icon</label>
      <input type="text" id="pImage" placeholder="📱 (use any emoji)" maxlength="4">
      <label for="pCategory">Category *</label>
      <select id="pCategory">
        <option value="Electronics">📱 Electronics</option>
        <option value="Fashion">👟 Fashion</option>
        <option value="Home">🧹 Home</option>
        <option value="Books">📚 Books</option>
        <option value="Gaming">🎮 Gaming</option>
        <option value="Sports">⚽ Sports</option>
        <option value="Other">📦 Other</option>
      </select>
      <label for="pStock">Stock Quantity</label>
      <input type="number" id="pStock" placeholder="50" min="0">
      <label for="pDesc">Description</label>
      <textarea id="pDesc" placeholder="Describe the product features and benefits..."></textarea>
      <button class="btn-amazon" onclick="addProduct()" style="margin-top:8px">➕ Add Product to Store</button>
    </div>
    <div id="msg"></div>
    <hr style="margin:24px 0;border:none;border-top:1px solid #e8e8e8">
    <div style="text-align:center"><a href="admin.html" style="font-size:14px">← Back to Dashboard</a></div>
  </div>
</section>
<footer><p>© 2026 My Store Host Panel.</p></footer>
<script src="app.js"></script>
</body>
</html>
