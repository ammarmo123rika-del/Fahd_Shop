<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout - Fahd Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">Fahd<span>Shop</span></a>
    <div class="header-links">
      <a class="loginLink" href="login.html"><span class="label">Hello, Sign in</span><span class="value">Account</span></a>
      <a href="cart.html" class="cart-link"><span class="value">🛒</span><span class="cart-count" id="cartCount" style="display:none">0</span></a>
    </div>
  </div>
</div>
<div class="nav-bar"><div class="nav-bar-inner">
  <a href="index.html">Home</a><a href="products.html">All Products</a>
</div></div>
<section>
  <h1 style="font-size:28px;margin-bottom:16px">💳 Checkout</h1>
  <div class="card" style="max-width:600px;padding:30px">
    <p>Review your order and click Place Order to complete your purchase.</p>
    <div id="cartSummary"></div>
    <button class="btn-amazon btn-block" onclick="checkout()" style="margin-top:16px">Place Order</button>
  </div>
</section>
<footer><p>© 2026 Fahd Shop.</p></footer>
<script src="app.js"></script>
<script>
(function(){
  const cart=getCart();
  const products=getProducts();
  const el=document.getElementById('cartSummary');
  if(!cart.length){el.innerHTML='<p style="margin:16px 0">Your cart is empty. <a href="products.html">Go shopping</a></p>';return}
  let total=0;
  el.innerHTML=cart.map(ci=>{
    const p=products.find(x=>x.id===ci.id);
    if(!p)return'';
    total+=p.price*ci.qty;
    return`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><span>${p.image} ${p.name} × ${ci.qty}</span><b>$${(p.price*ci.qty).toLocaleString()}</b></div>`;
  }).join('')+'<div style="text-align:right;padding:16px 0;font-size:20px"><b>Total: $'+total.toLocaleString()+'</b></div>';
})();
</script>
</body>
</html>
