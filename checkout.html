<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout - My Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">My<span>Store</span></a>
    <div class="header-links">
      <a class="loginLink" href="login.html"><span class="label">Hello, Sign in</span><span class="value">Account</span></a>
      <a href="cart.html" class="cart-link"><span class="value">🛒</span><span class="cart-count" id="cartCount" style="display:none">0</span></a>
    </div>
  </div>
</div>
<div class="nav-bar"><div class="nav-bar-inner">
  <a href="index.html">🏠 Home</a><a href="products.html">🛍️ All Products</a>
</div></div>
<section>
  <div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:20px;padding:30px 40px;margin-bottom:24px;color:#fff;box-shadow:0 10px 40px rgba(102,126,234,0.3)">
    <h1 style="font-size:32px">💳 Checkout</h1>
  </div>
  <div class="card" style="max-width:600px;padding:32px">
    <h2 style="margin-bottom:16px">Order Summary</h2>
    <p style="color:#666;margin-bottom:20px">Review your order and click Place Order to complete your purchase.</p>
    <div id="cartSummary"></div>
    <button class="btn-amazon btn-block" onclick="checkout()" style="margin-top:20px;font-size:16px;padding:16px">💳 Place Order</button>
  </div>
</section>
<footer><p>© 2026 My Store.</p></footer>
<script src="app.js"></script>
<script>
(function(){
  const cart=getCart();
  const products=getProducts();
  const el=document.getElementById('cartSummary');
  if(!cart.length){el.innerHTML='<div class="empty" style="padding:30px"><p>Your cart is empty. <a href="products.html">Go shopping</a></p></div>';return}
  let total=0;
  el.innerHTML=cart.map(ci=>{
    const p=products.find(x=>x.id===ci.id);
    if(!p)return'';
    total+=p.price*ci.qty;
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #f0f0f0"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:28px">${p.image}</span><div><b style="font-size:14px">${p.name}</b><p style="color:#888;font-size:12px">Qty: ${ci.qty}</p></div></div><b style="color:#f5576c">$${(p.price*ci.qty).toLocaleString()}</b></div>`;
  }).join('')+'<div style="text-align:right;padding:20px 0;font-size:22px"><b>Total: <span style="background:linear-gradient(135deg,#f5576c,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent">$'+total.toLocaleString()+'</span></b></div>';
})();
</script>
</body>
</html>
