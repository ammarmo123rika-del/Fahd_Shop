<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart - Fahd Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">Fahd<span>Shop</span></a>
    <div class="search-bar">
      <select><option>All</option></select>
      <input type="search" placeholder="Search Fahd Shop...">
      <button>🔍</button>
    </div>
    <div class="header-links">
      <a class="loginLink" href="login.html">
        <span class="label">Hello, Sign in</span>
        <span class="value">Account</span>
      </a>
      <a href="cart.html" class="cart-link" style="border:1px solid rgba(255,255,255,0.3);border-radius:10px;background:rgba(255,255,255,0.1)">
        <span class="label">Your Cart</span>
        <span class="value">🛒 Cart</span>
        <span class="cart-count" id="cartCount" style="display:none">0</span>
      </a>
    </div>
  </div>
</div>

<div class="nav-bar">
  <div class="nav-bar-inner">
    <a href="index.html">🏠 Home</a>
    <a href="products.html">🛍️ All Products</a>
    <a href="wishlist.html">♡ Wishlist</a>
    <a href="orders.html">📦 My Orders</a>
  </div>
</div>

<section>
  <div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:20px;padding:30px 40px;margin-bottom:24px;color:#fff;box-shadow:0 10px 40px rgba(102,126,234,0.3)">
    <h1 style="font-size:32px">🛒 Shopping Cart</h1>
  </div>
  <div style="display:flex;gap:28px;flex-wrap:wrap">
    <div style="flex:2;min-width:320px" id="cart"></div>
    <div style="flex:1;min-width:280px">
      <div class="cart-total" id="cartTotal"></div>
    </div>
  </div>
</section>

<footer><p>© 2026 Fahd Shop.</p></footer>
<script src="app.js"></script>
<script>renderCart()</script>
</body>
</html>
