<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account - Fahd Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">Fahd<span>Shop</span></a>
  </div>
</div>
<main style="padding:40px 20px">
  <div class="form-card">
    <h1>Create Account</h1>
    <p class="subtitle">Join Fahd Shop today</p>
    <label for="name">Your Name</label>
    <input type="text" id="name" placeholder="Fahd">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="your@email.com">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 4 characters" onkeydown="if(event.key==='Enter')signup()">
    <button class="btn-amazon" onclick="signup()">Create Account</button>
    <div id="msg"></div>
    <hr style="margin:20px 0;border:none;border-top:1px solid #e7e7e7">
    <div style="text-align:center">
      <p style="font-size:13px;color:#555;margin-bottom:8px">Already have an account?</p>
      <a href="login.html" class="btn-amazon btn-block" style="text-decoration:none;text-align:center;display:block">Sign In</a>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
