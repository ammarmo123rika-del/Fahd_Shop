<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account - My Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">Fahd<span>Shop</span></a>
  </div>
</div>
<main style="padding:50px 20px;min-height:70vh;display:flex;align-items:center;justify-content:center">
  <div class="form-card">
    <h1>✨ Create Account</h1>
    <p class="subtitle">Join My Store and start shopping today</p>
    <label for="name">Your Name</label>
    <input type="text" id="name" placeholder="Fahd">
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="your@email.com">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 4 characters" onkeydown="if(event.key==='Enter')signup()">
    <button class="btn-amazon" onclick="signup()">Create Account</button>
    <div id="msg"></div>
    <hr style="margin:24px 0;border:none;border-top:1px solid #e8e8e8">
    <div style="text-align:center">
      <p style="font-size:14px;color:#666;margin-bottom:12px">Already have an account?</p>
      <a href="login.html" class="btn-amazon btn-block" style="text-decoration:none;text-align:center;display:block;background:linear-gradient(135deg,#667eea,#764ba2);box-shadow:0 8px 30px rgba(102,126,234,0.3)">Sign In</a>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
