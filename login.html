<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In - Fahd Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">Fahd<span>Shop</span></a>
  </div>
</div>

<main style="padding:50px 20px;min-height:70vh;display:flex;align-items:center;justify-content:center">
  <div class="form-card">
    <h1>👋 Welcome Back</h1>
    <p class="subtitle">Sign in to your Fahd Shop account</p>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="fahdm19573@gmail.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password" onkeydown="if(event.key==='Enter')login()">

    <button class="btn-amazon" onclick="login()">Sign In</button>

    <div id="msg"></div>

    <div style="text-align:center;margin-top:24px;padding:16px;background:linear-gradient(135deg,#f8f9ff,#f0f2ff);border-radius:12px">
      <p style="font-size:12px;color:#888;margin-bottom:6px">🔐 Demo Host Account</p>
      <p style="font-size:13px"><b>fahdm19573@gmail.com</b></p>
      <p style="font-size:13px"><b>fahd19573</b></p>
    </div>

    <hr style="margin:24px 0;border:none;border-top:1px solid #e8e8e8">

    <div style="text-align:center">
      <p style="font-size:14px;color:#666;margin-bottom:12px">New to Fahd Shop?</p>
      <a href="signup.html" class="btn-amazon btn-block" style="text-decoration:none;text-align:center;display:block;background:linear-gradient(135deg,#667eea,#764ba2);box-shadow:0 8px 30px rgba(102,126,234,0.3)">Create your account</a>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
