<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account - My Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">My<span>Store</span></a>
    <div class="header-links">
      <a class="loginLink" href="login.html"><span class="label">Hello, Sign in</span><span class="value">Account</span></a>
      <a href="cart.html" class="cart-link"><span class="value">🛒</span><span class="cart-count" id="cartCount" style="display:none">0</span></a>
    </div>
  </div>
</div>
<div class="nav-bar"><div class="nav-bar-inner">
  <a href="index.html">🏠 Home</a><a href="products.html">🛍️ All Products</a><a href="orders.html">📦 My Orders</a><a href="wishlist.html">♡ Wishlist</a>
</div></div>
<section>
  <div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:20px;padding:30px 40px;margin-bottom:24px;color:#fff;box-shadow:0 10px 40px rgba(102,126,234,0.3)">
    <h1 style="font-size:32px">👤 My Account</h1>
  </div>
  <div id="accountInfo" class="card" style="max-width:600px;padding:32px">
    <p style="text-align:center;color:#888">Loading...</p>
  </div>
</section>
<footer><p>© 2026 My Store.</p></footer>
<script src="app.js"></script>
<script>
(function(){
  const u=getCurrentUser();
  const el=document.getElementById('accountInfo');
  if(!u){
    el.innerHTML='<div class="empty"><div class="icon">👤</div><h2>Not Signed In</h2><p style="margin:12px 0">Sign in to manage your account</p><a href="login.html" class="btn" style="display:inline-block;margin-top:12px">🔑 Sign In</a></div>';
    return;
  }
  el.innerHTML=`
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:36px;color:#fff">${u.name.charAt(0).toUpperCase()}</div>
      <h2 style="margin-bottom:4px">Welcome, ${u.name}!</h2>
      <p style="color:#888">${u.email}</p>
      <span class="badge ${u.role==='host'?'badge-green':'badge-yellow'}" style="margin-top:8px">${u.role==='host'?'Host / Admin':'Customer'}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px">
      <a href="orders.html" class="btn btn-outline" style="text-align:center;text-decoration:none">📦 My Orders</a>
      <a href="wishlist.html" class="btn btn-outline" style="text-align:center;text-decoration:none">❤️ Wishlist</a>
      <a href="cart.html" class="btn btn-outline" style="text-align:center;text-decoration:none">🛒 Cart</a>
      <button class="btn btn-red" onclick="logout()">🚪 Sign Out</button>
    </div>
  `;
})();
</script>
</body>
</html>
