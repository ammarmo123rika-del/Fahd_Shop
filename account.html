<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account - Fahd Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <a class="logo" href="index.html">Fahd<span>Shop</span></a>
    <div class="header-links">
      <a class="loginLink" href="login.html"><span class="label">Hello, Sign in</span><span class="value">Account</span></a>
      <a href="cart.html" class="cart-link"><span class="value">🛒</span><span class="cart-count" id="cartCount" style="display:none">0</span></a>
    </div>
  </div>
</div>
<div class="nav-bar"><div class="nav-bar-inner">
  <a href="index.html">Home</a><a href="products.html">All Products</a><a href="orders.html">My Orders</a><a href="wishlist.html">♡ Wishlist</a>
</div></div>
<section>
  <h1 style="font-size:28px;margin-bottom:20px">👤 My Account</h1>
  <div id="accountInfo" class="card" style="max-width:600px;padding:30px">
    <p>Loading...</p>
  </div>
</section>
<footer><p>© 2026 Fahd Shop.</p></footer>
<script src="app.js"></script>
<script>
(function(){
  const u=getCurrentUser();
  const el=document.getElementById('accountInfo');
  if(!u){
    el.innerHTML='<div class="empty"><div class="icon">👤</div><p>You are not signed in</p><a href="login.html" class="btn mt-20">Sign In</a></div>';
    return;
  }
  el.innerHTML=`
    <h2 style="margin-bottom:16px">Welcome, ${u.name}!</h2>
    <p><b>Email:</b> ${u.email}</p>
    <p><b>Role:</b> ${u.role==='host'?'Host / Admin':'Customer'}</p>
    <div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap">
      <a href="orders.html" class="btn">📦 My Orders</a>
      <a href="wishlist.html" class="btn btn-outline">❤️ Wishlist</a>
      <button class="btn btn-red" onclick="logout()">Sign Out</button>
    </div>
  `;
})();
</script>
</body>
</html>
