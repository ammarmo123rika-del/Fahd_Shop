<section>

  </div>
  <div class="form-card" style="max-width:600px">
    <h2 style="margin-bottom:16px">Store Configuration</h2>
    <label>Store Name</label>
    <input type="text" id="storeName" placeholder="My Store" value="My Store">
    <label>Contact Email</label>
    <input type="email" id="storeEmail" placeholder="fahdm19573@gmail.com" value="fahdm19573@gmail.com">
    <label>Currency</label>
    <select id="storeCurrency">
      <option value="USD" selected>$ USD - US Dollar</option>
      <option value="EUR">€ EUR - Euro</option>
      <option value="GBP">£ GBP - British Pound</option>
    </select>
    <button class="btn-amazon" onclick="alert('✅ Settings saved!')">💾 Save Settings</button>
    <hr style="margin:24px 0;border:none;border-top:1px solid #e8e8e8">
    <div style="text-align:center"><a href="admin.html" style="font-size:14px">← Back to Dashboard</a></div>
